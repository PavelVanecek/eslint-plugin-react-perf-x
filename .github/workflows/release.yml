name: npm publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  # Trusted publishing needs npm 11.5.1 or newer, which ships with Node 24.
  NODE_VERSION: 24.x

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # never use caching in release builds
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Also builds dist/ via pretest, and checks the packed file list.
      - run: npm test
      - run: npm run lint:package
      # --ignore-scripts: dist/ was just built and tested, don't rebuild it.
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: '*.tgz'
          retention-days: 1

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC), also signs provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false # never use caching in release builds
      - uses: actions/download-artifact@v8
        with:
          name: package
      - name: Determine release version and npm dist-tag
        id: release-info
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          # Release tags look like v4.0.0 or v4.1.0-beta.0.
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "Release tag must start with 'v' (got: $RELEASE_TAG)." >&2
            exit 1
          fi
          RELEASE_VERSION="${RELEASE_TAG#v}"

          # Fail fast if the release tag and package.json disagree, so we don't
          # publish one version while the GitHub release advertises another.
          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Release tag ($RELEASE_TAG) does not match package.json version ($PACKAGE_VERSION)." >&2
            exit 1
          fi

          # Stable versions go to "latest". Prereleases like 4.1.0-beta.0 go to
          # a dist-tag named after the first prerelease identifier ("beta").
          NPM_TAG=latest
          if [[ "$PACKAGE_VERSION" =~ -([0-9A-Za-z]+)(\.[0-9A-Za-z.-]+)?$ ]]; then
            NPM_TAG="${BASH_REMATCH[1]}"
          fi

          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "tarball=eslint-plugin-react-perf-x-$PACKAGE_VERSION.tgz" >> "$GITHUB_OUTPUT"
      - run: npm publish "${{ steps.release-info.outputs.tarball }}" --tag "${{ steps.release-info.outputs.npm_tag }}" --access public
